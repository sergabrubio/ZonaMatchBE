# Copiar a .github/workflows/build-backend-image.yml en el repo del backend (ZonaMatchBE).
# Requiere un "Dockerfile" en la raiz del repo (plantilla: docker/Dockerfile.api.example).
#
# Construye la imagen del API y la publica en GitHub Container Registry (gratis),
# con dos etiquetas: el SHA del commit y "latest".
#
# IMPORTANTE (una sola vez): los paquetes nuevos de GHCR son PRIVADOS. Como el
# Container App descarga la imagen sin credenciales, hay que hacerlo publico:
#   GitHub > tu perfil > Packages > zonamatch-api > Package settings >
#   Change visibility > Public
# Antes de hacerlo, verifica que la imagen no contenga secretos (contrasenas,
# claves). Los secretos se pasan por variables de entorno desde Terraform.
#
# Despues de cada build, el resumen del job muestra la linea para terraform.tfvars.
# Usar la etiqueta con el SHA (no "latest"): si la etiqueta no cambia, Terraform
# no detecta que hay una imagen nueva.
name: Build backend image

on:
  push:
    branches: [main, Development]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nombres en minusculas.
      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zonamatch-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Pegar en terraform.tfvars y ejecutar terraform apply:"
            echo '```'
            echo "backend_image = \"${IMAGE}:${GITHUB_SHA}\""
            echo "backend_port  = 8080"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"